name: agentguard-product
x-api-image: &api-image
  image: agentguard-product-api:latest
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_DB: agentguard
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - ./.local/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    <<: *api-image
    user: "${AGENTGUARD_CONTAINER_USER:-10001:10001}"
    environment:
      AGENTGUARD_SECRET_FILE: /run/secrets/platform_config
      CORS_ALLOWED_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
      COOKIE_SECURE: "false"
      DEPLOYMENT_MODE: local
    secrets: [platform_config]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  worker:
    <<: *api-image
    user: "${AGENTGUARD_CONTAINER_USER:-10001:10001}"
    entrypoint: ["python", "-m", "apps.worker"]
    environment:
      AGENTGUARD_SECRET_FILE: /run/secrets/platform_config
      DEPLOYMENT_MODE: local
      AGENTGUARD_WORKER_POLL_SECONDS: "2"
    secrets: [platform_config]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: apps/web
      args:
        VITE_API_BASE_URL: /api
    ports: ["127.0.0.1:5000:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
secrets:
  postgres_password:
    file: ./.local/postgres-password
  platform_config:
    file: ./.local/platform-config.json
